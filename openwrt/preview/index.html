     'environment','profiles','logging'].forEach(function(key){detail[key]=state[key];});
    resolve(JSON.parse(JSON.stringify(detail)));return;
   }
   if (spec.method === 'logs') {
    resolve({ok:true,kind:args[0],text:args[0]===state.log_kind?state.log:state.featureLogs[args[0]] || state[args[0]] || ''});return;
   }
   if (spec.method === 'domains') {resolve(JSON.parse(JSON.stringify(domainResult(args[0]))));return;}
   if (spec.method === 'domain_monitor') {resolve(JSON.parse(JSON.stringify(monitorResult(args[0],args[1]))));return;}
   if (spec.method === 'domain_batch_start') {
    if(!state.logging.domains){resolve({ok:false,error:'[演示] 开启域名采集后新建批次。'});return;}
    var now=Date.now()/1000, id=(Date.now().toString(16)+String(++jobSequence)).padStart(32,'0');
    if(domainBatches[0]){domainBatches[0].state='archived';domainBatches[0].ended_at=new Date().toISOString();}
    var batch={id:id,epoch:now,time:new Date().toISOString(),last_epoch:now,last_seen:new Date().toISOString(),
     state:'collecting',source:'manual',domains:[],events:[],event_count:0};
    domainBatches.unshift(batch);domainBatches=domainBatches.slice(0,32);
    window.setTimeout(function(){
     batch.domains=domainRows.map(function(row){return demoBatchRow(row,now);});
     batch.events=domainEvidence.events.map(function(event){return Object.assign({},event,{time:new Date().toISOString(),qtype:1});});
     batch.event_count=batch.events.length;
     if(instance && instance.activeTab==='monitor') instance.refreshDomains(true);
    },1200);
    resolve({ok:true,id:id,time:batch.time});return;
   }
   if (spec.method === 'logging') {
    var tag=args[2],changed=tag!==state.logging.tag;
    state.logging={mode:args[0],domains:!!args[1],tag:tag,tag_since:changed?Date.now()/1000:state.logging.tag_since};
    resolve({ok:true,logging:state.logging});return;
   }
   if (spec.method === 'incident') {
    var evidence=JSON.parse(JSON.stringify(domainEvidence));
    evidence.events.forEach(function(item,index){item.time=new Date(Date.now()-(3-index)*1000).toISOString();});
    var incident={id:(Date.now().toString(16)+String(++jobSequence)).padStart(32,'0'),source:'manual',note:args[0],
     time:new Date().toISOString(),tag:state.logging.tag,evidence:evidence,captured_at:new Date().toISOString()};
    incidents.unshift(incident);incidents=incidents.slice(0,32);
    resolve({ok:true,id:incident.id,time:incident.time});return;
   }
   if (spec.method === 'profile') {
    var restarting = state.running, previousProfile = state.config.profile;
    var profileId = job('profile',{state:'running',busy:true,restarted:restarting,
     previous_profile:previousProfile,phase:restarting?'stopping':'saving'});
    state.running=false;state.control_mbps=0;
    state.log='[演示] '+(restarting?'正在停止旧中继并恢复网络。':'正在保存码率。');
    window.setTimeout(function() {
     if (state.job.id !== profileId || !state.job.busy) return;
     state.config.profile=args[0];state.job.phase=restarting?'starting':'ready';
     state.log+='\n[演示] 已保存 '+args[0]+' Mbps，连接测试记录保留。';
     if (!restarting) {state.job.busy=false;state.job.state='complete';state.job.applied_profile=args[0];return;}
     window.setTimeout(function() {
      if (state.job.id !== profileId || !state.job.busy) return;
      state.running=true;state.mode='active';runningSince=Date.now();
      state.job.busy=false;state.job.state='complete';state.job.phase='ready';state.job.applied_profile=args[0];
      state.log+='\n[演示] 中继已自动重启，请重新连接 Portal。';
      state.events+='\n'+new Date().toLocaleString('zh-CN')+' INFO [演示] 新档位已就绪，目标码率='+args[0]+' Mbps';
     },2500);
    },1500);
   }
   if (spec.method === 'start') {
    state.running=true; state.autostart=!!args[0];state.mode='active';runningSince=Date.now();state.modified++;job('start');
    state.events+='\n'+new Date().toLocaleString('zh-CN')+' INFO [演示] 已修改新连接请求，目标码率='+state.config.profile+' Mbps';
   }
   if (spec.method === 'stop') {
    var cancelledAction=state.job.busy?state.job.action:null;
    if(cancelledAction && cancelledAction.indexOf('psportal_')===0){
     job(cancelledAction,{state:'cancelled'});
     state.log='[演示] 名单应用已取消，原名单已保留。';
    }else{
     state.running=false;state.control_mbps=0;job(cancelledAction || 'stop',cancelledAction?{state:'cancelled'}:{});
     state.recovery_required=false;state.cleanup_pending=false;
     state.log='[演示] 中继已停止，网络恢复完成。';
    }
   }
   if (spec.method === 'configure') {
    ['bridge','address','ps5_ip','portal_ip','profile'].forEach(function(key,i){state.config[key]=args[i];});
    state.configured=true;state.baseline_valid=false;state.baseline_saved=false;state.baseline_reason='配置已保存，可启动增强';job('configure');
    state.log='[演示] 设备配对完成，请开始连接测试。';
   }
   if (spec.method === 'baseline' || spec.method === 'trial') {
    state.running=true;state.mode=spec.method==='baseline'?'baseline':'active';runningSince=Date.now();
    var testId=job(spec.method,{state:'running',busy:true});state.log='[演示] '+(spec.method==='baseline'?'BASELINE READY':'AUTO READY')+'\n[演示] 请重新连接 Portal。';
    window.setTimeout(function(){
     if (!state.running || state.job.id !== testId) return;
     state.running=false;job(spec.method);
     if (spec.method==='baseline') {state.baseline_valid=true;state.baseline_saved=true;state.baseline_reason='设备、网桥与代码校验通过';}
     state.log+='\n[演示] 测试已完成，网络恢复完成。';
    },5000);
   }
   if (spec.method === 'doctor') {job('doctor');state.log='[演示] Python / Scapy / libpcap：检查通过\n[演示] 主路由 IPv4 转发：1\n[演示] 目标平台：rockchip/armv8\n[演示] 网络恢复路径：就绪';}
   if (spec.method === 'repair') {job('repair');state.recovery_required=false;state.cleanup_pending=false;state.log='[演示] 网络恢复完成。';}
   if (spec.method === 'proxy_diagnostics') {
    resolve({ok:true,generated_at:new Date().toISOString(),proxy:policyStatus(),
     domain_diagnostics:domainResult(''),preview:true});return;
   }
   if (spec.method === 'diagnostics') {
    resolve({ok:true,generated_at:new Date().toISOString(),environment:state.environment,
     network:{bridge:state.config.bridge,paired:true},service:{running:state.running,modified:state.modified},
     baseline:{valid:state.baseline_valid},profile:state.config.profile,observability:state.observability,
     logging:state.logging,domain_diagnostics:domainResult(''),preview:true});return;
   }
   resolve({ok:true});
  },120);
 });
}; } };
window.view = { extend:function(object) { return object; } };
window.L = { hasViewPermission:function() { return true; } };
window.ui = { createHandlerFn:function(object, fn, name) { return function(event) {
 var target=event.currentTarget;target.disabled=true;
 Promise.resolve(fn.call(object,name,event)).finally(function(){target.disabled=false;});
}; },
 addNotification:function(_,element) {element.className='preview-alert alert-message warning';document.getElementById('app').prepend(element);} };
window.poll = { add:function(fn, seconds) { window.setInterval(fn,seconds*1000); } };
fetch('../luci/htdocs/luci-static/resources/view/ps-accel/settings.js').then(function(response){return response.text();}).then(function(source){
 instance = new Function(source)();
 return instance.load().then(function(data){document.getElementById('app').appendChild(instance.render(data));});
}).catch(function(error){document.getElementById('app').textContent=error.message;});
document.getElementById('theme').addEventListener('click',function(){
 var dark=document.documentElement.getAttribute('data-darkmode')!=='true';
 document.documentElement.setAttribute('data-darkmode',String(dark));
 this.textContent=dark?'切换浅色':'切换深色';
});
document.getElementById('recording').addEventListener('change',function(){
 var delayed=this.value==='delayed', failed=this.value==='failed';
 state.observability={status_fresh:!delayed,write_errors:failed?3:0,dropped_logs:failed?2:0,
  coalesced_snapshots:delayed?12:0,last_error:failed?'[演示] 日志写入失败':''};
 state.quality=demoQuality();
 if(instance) instance.update(JSON.parse(JSON.stringify(state)));
});
document.getElementById('quality').addEventListener('change',function(){
 qualityDemo=this.value;state.quality=demoQuality();
 if(instance) instance.update(JSON.parse(JSON.stringify(state)));
});
document.getElementById('recovery').addEventListener('change',function(){
 state.state_known=this.value!=='query';
 state.status_warnings=this.value==='query'?['[演示] 进程状态查询超时']:[];
 state.cleanup_pending=this.value==='cleanup';state.recovery_required=this.value==='cleanup';
 if(this.value==='cleanup') {
  state.running=false;state.control_mbps=0;
  job('stop',{state:'failed',error:'[演示] 中继已停止，网络空间删除失败。'});
  state.log='[演示] 清理中断，保留归属记录。点击“恢复网络”从中断处继续。';
 }
 if(instance) instance.update(JSON.parse(JSON.stringify(state)));
});
</script>
